<main class="faq-page container-custom">
  <header class="faq-header">
    <h1>Frequently Asked Questions</h1>
    <p>Everything you need to know about our experiences at ExpediNap.</p>
  </header>

  <section class="faq-content">
    <app-accordeon [items]="faqs" [allowMultiple]="false"></app-accordeon>
  </section>

  <footer class="faq-footer">
    <div class="support-card">
      <h3>Do you still have doubts?</h3>
      <p>Our team is available 24/7 to help you via WhatsApp.</p>
      <app-button variant="accent" (click)="openWhatsApp()">
        SPEAK TO SUPPORT
      </app-button>
    </div>
  </footer>
</main>
