<div class="blog-page-wrapper bg-background">

  <!-- HERO GENÉRICO -->
  <app-hero-generic
    title="Travel Blog"
    badgeText="Caribbean Adventures Blogs"
    description="Guides, tips and everything you need for your Caribbean adventure."
    bgImageUrl="/img/blog-hero.webp">
  </app-hero-generic>

  <!-- FILTER BAR (Flujo normal del DOM, sin sticky ni z-index invasivo) -->
  <section class="filter-bar bg-background py-5 border-b border-border/20">
    <div class="container-custom max-w-350 mx-auto px-6">
      <div
        class="filter-wrapper flex items-center justify-center gap-4 max-sm:flex-col max-sm:items-stretch">
        <label for="category-select"
          class="filter-label flex items-center gap-2 font-semibold text-muted-foreground text-sm uppercase tracking-[1px]">
          <lucide-icon name="list-filter" [size]="18"
            aria-hidden="true"></lucide-icon>
          Filter by:
        </label>

        <div class="select-container relative min-w-55 max-sm:w-full">
          <select
            id="category-select"
            name="category"
            class="custom-select w-full appearance-none bg-card border border-border px-4 py-3 pr-10 rounded-xl text-foreground text-base font-medium cursor-pointer transition-all duration-200 hover:border-accent focus:outline-none focus:border-accent focus:ring-3 focus:ring-accent/20"
            (change)="onCategoryChange($event)">
            @for (cat of categories; track cat.id) {
            <option [value]="cat.id">{{ cat.label | titlecase}}</option>
            }
          </select>
          <lucide-icon name="chevron-down"
            class="select-icon absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-muted-foreground"
            [size]="16" aria-hidden="true"></lucide-icon>
        </div>
      </div>
    </div>
  </section>

  <!-- FEATURED SECTION -->
  <main class="featured-section py-20 min-h-[80vh]">
    <div class="container-custom max-w-350 mx-auto px-6">

      @if (isLoading) {
      <div
        class="loading-state min-h-[45vh] flex flex-col items-center justify-center gap-4 text-muted-foreground text-center"
        aria-live="polite">
        <div
          class="spinner w-11 h-11 rounded-full border-4 border-border border-t-accent animate-spin"></div>
        <p>Loading articles...</p>
      </div>
      } @else {

      <div
        class="featured-grid grid gap-8 grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
        @for (blog of blogs; track blog._id) {
        <article class="h-full">
          <app-blog-card [blog]="blog"></app-blog-card>
        </article>
        }
      </div>

      @if (paginationData && paginationData.totalPages > 1) {
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="paginationData.totalPages"
        [hasNextPage]="paginationData.hasNextPage"
        [hasPrevPage]="paginationData.hasPrevPage"
        (pageChange)="loadBlogs($event)">
      </app-pagination>
      }

      }

    </div>
  </main>

</div>
