<section 
  class="not-found-wrapper min-h-[75vh] flex items-center justify-center p-6 md:p-12 bg-background text-foreground transition-colors duration-300"
  aria-labelledby="not-found-title">
  
  <div class="not-found-content text-center max-w-130 mx-auto flex flex-col items-center">
    
    <!-- Ancla animada decorativa (Ignorada por Screen Readers) -->
    <div 
      class="icon-box text-6xl md:text-7xl text-accent mb-2 drop-shadow-md motion-safe:animate-[ship-sway_4s_ease-in-out_infinite]"
      aria-hidden="true">
      <lucide-icon name="anchor" [size]="56" class="mx-auto text-accent"></lucide-icon>
    </div>

    <!-- 404 Decorativo Gigante -->
    <span 
      class="display-title font-sans font-black text-[clamp(6rem,18vw,9rem)] leading-none tracking-tighter text-foreground/15 select-none -mb-6 md:-mb-10"
      aria-hidden="true">
      404
    </span>

    <!-- Encabezado Semántico Principal (SEO + A11y) -->
    <h1 
      id="not-found-title" 
      class="sub-title font-sans text-2xl md:text-4xl font-extrabold text-foreground tracking-tight mb-3 z-10">
      Lost at sea?
    </h1>

    <p class="description font-sans text-muted-foreground text-base md:text-lg mb-8 leading-relaxed max-w-110">
      The page you are looking for has sailed away or never existed in our port.
    </p>
    
    <!-- Botón con estado Focus visible y aria-label descriptivo -->
    <a 
      routerLink="/" 
      aria-label="Return to ExpediNap home page"
      class="inline-flex items-center justify-center gap-2.5 px-8 py-3.5 min-h-12 bg-accent text-accent-foreground font-semibold text-base rounded-xl shadow-md transition-all duration-300 hover:scale-[1.02] hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent active:scale-[0.98]">
      <lucide-icon name="arrow-left" [size]="20" aria-hidden="true"></lucide-icon>
      <span>Return to Port</span>
    </a>

  </div>
</section>
