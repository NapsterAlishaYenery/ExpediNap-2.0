<div class="excursions-page-wrapper">

  <section class="hero-header">
    <div class="hero-image-bg">
      <img src="/img/playa-tropical.webp" alt="Playa Dominicana">
    </div>

    <div class="hero-content">
      <h1 class="hero-title">Our Excursions</h1>
      <p class="hero-description">
        Discover the most exciting adventures in the Dominican Caribbean. <br>
        Unique experiences for all tastes.
      </p>
    </div>

    <div class="bottom-gradient-mask"></div>
  </section>

  <nav class="sticky-filter-bar">
    <div class="container-custom">
      <div class="filter-wrapper">
        <label for="category-select" class="filter-label">
          <lucide-icon name="list-filter" [size]="18"></lucide-icon>
          Filter by:
        </label>

        <div class="select-container">
          <select
            id="category-select"
            (change)="onCategoryChange($event)"
            name="category"
            class="custom-select">
            @for (cat of categories; track cat.id) {
            <option [value]="cat.id">{{ cat.label | titlecase }}</option>
            }
          </select>
          <lucide-icon name="chevron-down" class="select-icon"
            [size]="16"></lucide-icon>
        </div>
      </div>
    </div>
  </nav>

  <section class="featured-section">
    <div class="container-custom">

      @if (isLoading) {
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading adventures...</p>
      </div>
      }@else {
      <div class="featured-grid">
        @for (item of excursions; track item._id) {
        <app-excursion-card [excursion]="item"></app-excursion-card>
        }
      </div>

      @if (paginationData && paginationData.totalPages > 1) {
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="paginationData.totalPages"
        [hasNextPage]="paginationData.hasNextPage"
        [hasPrevPage]="paginationData.hasPrevPage"
        (pageChange)="loadExcursions($event)">
      </app-pagination>
      }
      }
    </div>
  </section>
</div>
