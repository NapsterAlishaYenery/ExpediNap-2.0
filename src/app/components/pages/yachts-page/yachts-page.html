<div class="yachts-page-wrapper bg-background">

  <!-- HERO GENÉRICO -->
  <app-hero-generic
    title="Luxury Yachts"
    description="Sail the crystal-clear waters of the Caribbean on our exclusive yachts. Private experiences tailored to your needs."
    badgeText="VIP Fleet"
    bgImageUrl="/img/yacht-luxury.webp">
  </app-hero-generic>

  <!-- FEATURED SECTION -->
  <section class="featured-section py-20 min-h-[80vh]">
    <div class="container-custom max-w-350 mx-auto px-6">

      @if (isLoading) {
        <div class="loading-state min-h-[45vh] flex flex-col items-center justify-center gap-4 text-muted-foreground text-center" aria-live="polite">
          <div class="spinner w-11 h-11 rounded-full border-4 border-border border-t-accent animate-spin"></div>
          <p>Loading exclusive fleet...</p>
        </div>
      } @else {

        <!-- Grid de yates (2 columnas en pantallas grandes para tarjetas mas anchas/detalladas) -->
        <div class="yachts-grid grid gap-8 grid-cols-1 lg:grid-cols-2">
          @for (item of yachts; track item._id) {
            <article class="h-full">
              <app-yacht-card [yacht]="item"></app-yacht-card>
            </article>
          }
        </div>

        <!-- Paginación -->
        @if (paginationData && paginationData.totalPages > 1) {
          <app-pagination
            [currentPage]="currentPage"
            [totalPages]="paginationData.totalPages"
            [hasNextPage]="paginationData.hasNextPage"
            [hasPrevPage]="paginationData.hasPrevPage"
            (pageChange)="loadYachts($event)">
          </app-pagination>
        }

      }

    </div>
  </section>

</div>
