<section class="activity-section flex flex-col gap-8">
  
  <!-- Header -->
  <div class="section-header flex justify-between items-center">
    <div>
      <h2 class="section-title text-2xl font-extrabold text-foreground m-0">User Accounts</h2>
      <p class="section-subtitle text-muted-foreground mt-1">Manage system access, roles, and permissions</p>
    </div>
    <div class="header-actions flex gap-3">
      <button class="btn-add flex items-center gap-2 bg-indigo-500 text-white border-none px-5 py-3 rounded-(--radius) font-semibold cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(99,102,241,0.3)] hover:brightness-110">
        <lucide-icon name="user-plus" size="18"></lucide-icon>
        Create User
      </button>
      <button class="btn-refresh flex items-center justify-center bg-card text-foreground border border-border w-10.5 h-10.5 rounded-(--radius) cursor-pointer" (click)="loadUsers()" [disabled]="loading">
        <lucide-icon name="refresh-cw" size="16" [class.spinning]="loading"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 bg-card p-5 border border-border rounded-(--radius) items-end">
    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Full Name</label>
      <input type="text" [(ngModel)]="filters.name" (keyup.enter)="applyFilters()" placeholder="Search name..." 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Username</label>
      <input type="text" [(ngModel)]="filters.username" (keyup.enter)="applyFilters()" placeholder="Search user..." 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Email</label>
      <input type="email" [(ngModel)]="filters.email" (keyup.enter)="applyFilters()" placeholder="user@expedinap.com" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Role</label>
      <select [(ngModel)]="filters.role" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        @for (r of roles; track r.id) {
          <option [value]="r.id">{{ r.label }}</option>
        }
      </select>
    </div>

    <div class="filter-actions flex gap-2">
      <button class="btn-primary bg-indigo-500 text-white border-none px-6 py-2.5 rounded-md cursor-pointer font-semibold" (click)="applyFilters()">Filter</button>
      <button class="btn-ghost bg-transparent border border-border text-muted-foreground px-3 py-2.5 rounded-md cursor-pointer" (click)="resetFilters()">
        <lucide-icon name="rotate-ccw" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card bg-card border border-border rounded-(--radius) p-6">
    <div class="card-header flex justify-between items-center mb-6">
      <div class="header-left flex items-center gap-3 text-indigo-500">
        <lucide-icon name="users" size="20"></lucide-icon>
        <h3 class="text-foreground m-0">Registered Users</h3>
      </div>
      <span class="count-badge bg-indigo-500/10 text-indigo-500 px-3 py-1 rounded-full text-xs font-bold">{{ paginationConfig.totalItems }} users</span>
    </div>

    @if (loading) {
      <div class="loading-state py-16 flex flex-col items-center gap-4 text-muted-foreground">
        <div class="spinner w-10 h-10 border-3 border-muted border-t-indigo-500 rounded-full animate-spin"></div>
        <p>Loading users...</p>
      </div>
    } @else {
      <app-generic-table
        [columns]="columns"
        [data]="users"
        [currentPage]="paginationConfig.currentPage"
        [limit]="paginationConfig.limit"
        (edit)="handleEdit($event)"
        (delete)="handleDelete($event)">
      </app-generic-table>

      <div class="pagination-wrapper mt-6 flex justify-center">
        <app-pagination
          [currentPage]="paginationConfig.currentPage"
          [totalPages]="paginationConfig.totalPages"
          [hasNextPage]="paginationConfig.hasNextPage"
          [hasPrevPage]="paginationConfig.hasPrevPage"
          (pageChange)="handlePageChange($event)">
        </app-pagination>
      </div>
    }
  </div>
</section>
