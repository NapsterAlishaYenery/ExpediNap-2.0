<section class="activity-section flex flex-col gap-8">
  
  <!-- Header -->
  <div class="section-header flex justify-between items-center">
    <div>
      <h2 class="section-title text-2xl font-extrabold text-foreground m-0">NCF Pool Management</h2>
      <p class="section-subtitle text-muted-foreground mt-1">Monitor and manage tax receipt numbers (DGII)</p>
    </div>
    <div class="header-actions flex gap-3">
      <button class="btn-add flex items-center gap-2 bg-emerald-500 text-white border-none px-5 py-3 rounded-(--radius) font-semibold cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(16,185,129,0.3)] hover:brightness-110" (click)="openBulkUpload()">
        <lucide-icon name="plus-circle" size="18"></lucide-icon>
        Bulk Load NCF
      </button>
      <button class="btn-refresh flex items-center justify-center bg-card text-foreground border border-border w-10.5 h-10.5 rounded-(--radius) cursor-pointer hover:bg-muted" (click)="loadNcfs()" [disabled]="loading">
        <lucide-icon name="refresh-cw" size="16" [class.spinning]="loading"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-card p-5 border border-border rounded-(--radius) items-end">
    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Search NCF</label>
      <div class="input-with-icon relative flex items-center">
        <lucide-icon name="hash" size="16" class="absolute left-3 text-muted-foreground"></lucide-icon>
        <input type="text" [(ngModel)]="filters.ncf" (keyup.enter)="applyFilters()" placeholder="B020000..." 
          class="bg-background border border-border text-foreground pl-9 pr-3 py-2.5 rounded-md outline-none text-sm w-full">
      </div>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">NCF Type</label>
      <select [(ngModel)]="filters.tipoNcf" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        @for (type of ncfTypes; track type.id) {
          <option [value]="type.id">{{ type.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Status</label>
      <select [(ngModel)]="filters.estado" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        @for (st of statusOptions; track st.id) {
          <option [value]="st.id">{{ st.label }}</option>
        }
      </select>
    </div>

    <div class="filter-actions flex gap-2">
      <button class="btn-primary bg-emerald-500 text-white border-none px-6 py-2.5 rounded-md cursor-pointer font-semibold" (click)="applyFilters()">Search</button>
      <button class="btn-ghost bg-transparent border border-border text-muted-foreground px-3 py-2.5 rounded-md cursor-pointer" (click)="resetFilters()">
        <lucide-icon name="rotate-ccw" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card bg-card border border-border rounded-(--radius) p-6">
    <div class="card-header flex justify-between items-center mb-6">
      <div class="header-left flex items-center gap-3 text-emerald-500">
        <lucide-icon name="receipt" size="20"></lucide-icon>
        <h3 class="text-foreground m-0">Available Receipts Pool</h3>
      </div>
      <span class="count-badge bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded-full text-xs font-bold">{{ paginationConfig.totalItems }} records</span>
    </div>

    @if (loading) {
      <div class="loading-state py-16 flex flex-col items-center gap-4 text-muted-foreground">
        <div class="spinner w-10 h-10 border-3 border-muted border-t-emerald-500 rounded-full animate-spin"></div>
        <p>Loading NCF pool...</p>
      </div>
    } @else {
      <app-generic-table
        [columns]="columns"
        [data]="ncfs"
        [currentPage]="paginationConfig.currentPage"
        [limit]="paginationConfig.limit"
        (delete)="handleDelete($event)">
      </app-generic-table>

      <div class="pagination-wrapper mt-6 flex justify-center">
        <app-pagination
          [currentPage]="paginationConfig.currentPage"
          [totalPages]="paginationConfig.totalPages"
          [hasNextPage]="paginationConfig.hasNextPage"
          [hasPrevPage]="paginationConfig.hasPrevPage"
          (pageChange)="handlePageChange($event)">
        </app-pagination>
      </div>
    }
  </div>
</section>
