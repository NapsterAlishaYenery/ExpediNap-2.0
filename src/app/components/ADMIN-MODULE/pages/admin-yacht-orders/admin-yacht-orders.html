<section class="activity-section flex flex-col gap-8">
  
  <!-- Header -->
  <div class="section-header flex justify-between items-start">
    <div>
      <h2 class="section-title text-2xl font-extrabold text-foreground m-0">Yacht Orders</h2>
      <p class="section-subtitle text-muted-foreground mt-1">Manage private charters, destinations, and fleet scheduling</p>
    </div>
    <button class="btn-refresh flex items-center gap-2 bg-primary text-primary-foreground border-none px-5 py-3 rounded-[var(--radius)] font-semibold cursor-pointer" (click)="loadOrders()" [disabled]="loading">
      <lucide-icon name="refresh-cw" size="16" [class.spinning]="loading"></lucide-icon>
      Sync Data
    </button>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 bg-card p-5 border border-border rounded-[var(--radius)] items-end">
    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Search Customer</label>
      <div class="input-with-icon relative flex items-center">
        <lucide-icon name="search" size="16" class="absolute left-3 text-muted-foreground"></lucide-icon>
        <input type="text" [(ngModel)]="filters.customerName" (keyup.enter)="applyFilters()" placeholder="Customer name..." 
          class="bg-background border border-border text-foreground pl-9 pr-3 py-2.5 rounded-md outline-none text-sm w-full">
      </div>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Status</label>
      <select [(ngModel)]="filters.status" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="paid">Paid</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Order #</label>
      <input type="text" [(ngModel)]="filters.orderNumber" (keyup.enter)="applyFilters()" placeholder="YT-000..." 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
    </div>

    <div class="filter-actions flex gap-2">
      <button class="btn-primary bg-primary text-primary-foreground border-none px-6 py-2.5 rounded-md cursor-pointer font-semibold" (click)="applyFilters()">Filter</button>
      <button class="btn-ghost bg-transparent border border-border text-muted-foreground px-3 py-2.5 rounded-md cursor-pointer flex items-center justify-center" (click)="resetFilters()" title="Clear Filters">
        <lucide-icon name="rotate-ccw" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card bg-card border border-border rounded-[var(--radius)] p-6">
    <div class="card-header flex justify-between items-center mb-6">
      <div class="header-left flex items-center gap-3 text-primary">
        <lucide-icon name="anchor" size="20"></lucide-icon>
        <h3 class="text-foreground m-0 text-lg">Master Yacht Bookings List</h3>
      </div>
      <span class="count-badge bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold">{{ paginationConfig.totalItems }} total records</span>
    </div>

    @if (loading) {
      <div class="loading-state py-16 flex flex-col items-center gap-4 text-muted-foreground">
        <div class="spinner w-10 h-10 border-3 border-muted border-t-primary rounded-full animate-spin"></div>
        <p>Updating yacht list...</p>
      </div>
    } @else {
      <app-generic-table
        [columns]="columns"
        [data]="orders"
        [currentPage]="paginationConfig.currentPage"
        [limit]="paginationConfig.limit"
        (edit)="handleEdit($event)"
        (delete)="handleDelete($event)">
      </app-generic-table>

      <div class="pagination-wrapper mt-6 flex justify-center border-t border-border/50 pt-6">
        <app-pagination
          [currentPage]="paginationConfig.currentPage"
          [totalPages]="paginationConfig.totalPages"
          [hasNextPage]="paginationConfig.hasNextPage"
          [hasPrevPage]="paginationConfig.hasPrevPage"
          (pageChange)="handlePageChange($event)">
        </app-pagination>
      </div>
    }
  </div>
</section>
