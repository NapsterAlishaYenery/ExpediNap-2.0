<section class="activity-section flex flex-col gap-8">
  
  <!-- Header -->
  <div class="section-header flex justify-between items-center">
    <div>
      <h2 class="section-title text-2xl font-extrabold text-foreground m-0">Manage Yachts</h2>
      <p class="section-subtitle text-muted-foreground mt-1">Control your fleet, pricing, and availability</p>
    </div>
    <div class="header-actions flex gap-3">
      <button class="btn-add flex items-center gap-2 bg-sky-600 text-white border-none px-5 py-3 rounded-(--radius) font-semibold cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:brightness-110" (click)="navigateToAdd()">
        <lucide-icon name="plus" size="18"></lucide-icon>
        Add New Yacht
      </button>
      <button class="btn-refresh flex items-center justify-center bg-card text-foreground border border-border w-10.5 h-10.5 rounded-(--radius) cursor-pointer" (click)="loadYachts()" [disabled]="loading">
        <lucide-icon name="refresh-cw" size="16" [class.spinning]="loading"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-card p-5 border border-border rounded-(--radius) items-end">
    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Yacht Name</label>
      <div class="input-with-icon relative flex items-center">
        <lucide-icon name="search" size="16" class="absolute left-3 text-muted-foreground"></lucide-icon>
        <input type="text" [(ngModel)]="filters.name" (keyup.enter)="applyFilters()" placeholder="Search by name..." 
          class="bg-background border border-border text-foreground pl-9 pr-3 py-2.5 rounded-md outline-none text-sm w-full">
      </div>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Sort By</label>
      <select [(ngModel)]="filters.sortBy" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        <option value="createdAt">Date Created</option>
        <option value="name">Name</option>
        <option value="maxPax">Capacity</option>
      </select>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Order</label>
      <select [(ngModel)]="filters.order" (change)="applyFilters()" 
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
    </div>

    <div class="filter-actions flex gap-2">
      <button class="btn-primary bg-primary text-primary-foreground border-none px-6 py-2.5 rounded-md cursor-pointer font-semibold" (click)="applyFilters()">Filter</button>
      <button class="btn-ghost bg-transparent border border-border text-muted-foreground px-3 py-2.5 rounded-md cursor-pointer" (click)="resetFilters()">
        <lucide-icon name="rotate-ccw" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card bg-card border border-border rounded-(--radius) p-6">
    <div class="card-header flex justify-between items-center mb-6">
      <div class="header-left flex items-center gap-3 text-sky-600">
        <lucide-icon name="anchor" size="20"></lucide-icon>
        <h3 class="text-foreground m-0">Registered Fleet List</h3>
      </div>
      <span class="count-badge bg-sky-600/10 text-sky-600 px-3 py-1 rounded-full text-xs font-bold">{{ paginationConfig.totalItems }} yachts</span>
    </div>

    @if (loading) {
      <div class="loading-state py-16 flex flex-col items-center gap-4 text-muted-foreground">
        <div class="spinner w-10 h-10 border-3 border-muted border-t-sky-600 rounded-full animate-spin"></div>
        <p>Fetching fleet data...</p>
      </div>
    } @else {
      <app-generic-table
        [columns]="columns"
        [data]="yachts"
        [currentPage]="paginationConfig.currentPage"
        [limit]="paginationConfig.limit"
        (edit)="handleEdit($event)"
        (delete)="handleDelete($event)">
      </app-generic-table>

      <div class="pagination-wrapper mt-6 flex justify-center">
        <app-pagination
          [currentPage]="paginationConfig.currentPage"
          [totalPages]="paginationConfig.totalPages"
          [hasNextPage]="paginationConfig.hasNextPage"
          [hasPrevPage]="paginationConfig.hasPrevPage"
          (pageChange)="handlePageChange($event)">
        </app-pagination>
      </div>
    }
  </div>
</section>
