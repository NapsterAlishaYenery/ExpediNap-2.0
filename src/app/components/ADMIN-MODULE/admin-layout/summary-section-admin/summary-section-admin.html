<section class="summary-container flex flex-col gap-6">
  
  <div class="summary-header border-l-4 border-l-primary pl-4">
    <h2 class="summary-title text-2xl font-bold text-foreground">Operations Summary</h2>
    <p class="summary-subtitle text-sm text-muted-foreground">Key metrics and current inventory status</p>
  </div>

  @if (!loading && summaryData) {
    <div class="stats-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      
      <app-stats-card-view-admin
        title="Excursions"
        [mainValue]="(summaryData.excursions.revenue | currency) ?? ''"
        icon="map"
        variant="primary"
        [statsDetails]="[
          { label: 'Reservations', value: summaryData.excursions.totalOrders },
          { label: 'Pending', value: summaryData.excursions.statusCount.pending }
        ]"
        footerText="Total cumulative sales of excursions">
      </app-stats-card-view-admin>

      <app-stats-card-view-admin
        title="Yachts"
        [mainValue]="(summaryData.yachts.revenue | currency) ?? ''"
        icon="ship"
        variant="accent"
        [statsDetails]="[
          { label: 'Reservations', value: summaryData.yachts.totalOrders },
          { label: 'Pending', value: summaryData.yachts.statusCount.pending }
        ]"
        footerText="Yacht rental income">
      </app-stats-card-view-admin>

      <app-stats-card-view-admin
        title="Transportation"
        [mainValue]="(summaryData.transfers.revenue | currency) ?? ''"
        icon="car"
        variant="secondary"
        [statsDetails]="[
          { label: 'Transfers', value: summaryData.transfers.totalOrders },
          { label: 'Ticket Prom.', value: (summaryData.transfers.averageTicket | currency) ?? '0' }
        ]"
        footerText="Transfer services performed">
      </app-stats-card-view-admin>

      @if (summaryData.ncf && summaryData.ncf.length > 0) {
        <app-stats-card-view-admin
          title="NCF Consumption"
          [mainValue]="summaryData.ncf[0].available"
          icon="file-text"
          [variant]="summaryData.ncf[0].available < 15 ? 'danger' : 'success'"
          [statsDetails]="[
            { label: 'Used', value: summaryData.ncf[0].used },
            { label: 'Expired', value: summaryData.ncf[0].expired }
          ]"
          [footerText]="summaryData.ncf[0].available < 15 ? 'Restock NCF soon!' : 'Stock available'">
        </app-stats-card-view-admin>
      }

    </div>
  } @else if (loading) {
    <div class="loading-state py-12 text-center text-muted-foreground border border-dashed border-border rounded-(--radius)">
      <div class="spinner w-10 h-10 border-3 border-muted border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
      <p>Loading statistics...</p>
    </div>
  }
</section>
