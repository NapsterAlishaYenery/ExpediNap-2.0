<section class="activity-section">
  <div class="section-header">
    <div>
      <h2 class="section-title">Activity Listing</h2>
      <p class="section-subtitle">Operational logistics and order control</p>
    </div>
    <button class="btn-refresh" (click)="loadExcursions()" [disabled]="loading">
      <lucide-icon name="refresh-cw" size="16"
        [class.spinning]="loading"></lucide-icon>
      Refresh
    </button>
  </div>

  <div class="filters-bar">
    <div class="filter-group">
      <label>Search Customer</label>
      <div class="input-with-icon">
        <lucide-icon name="search" size="16"></lucide-icon>
        <input type="text" [(ngModel)]="filters.customerName"
          (keyup.enter)="applyFilters()" placeholder="Nombre del cliente...">
      </div>
    </div>

    <div class="filter-group">
      <label>Status</label>
      <select [(ngModel)]="filters.status" (change)="applyFilters()">
        <option value>All Orders</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="paid">Paid</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="deleted">Deleted</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Order #</label>
      <input type="text" [(ngModel)]="filters.orderNumber"
        (keyup.enter)="applyFilters()" placeholder="EX-000...">
    </div>

    <div class="filter-actions">
      <button class="btn-primary" (click)="applyFilters()">
        Filter
      </button>
      <button class="btn-ghost" (click)="resetFilters()" title="Limpiar">
        <lucide-icon name="x" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="table-card">
    <div class="card-header">
      <div class="header-left">
        <lucide-icon name="compass" size="20"></lucide-icon>
        <h3>Daily Excursions</h3>
      </div>
      <span class="count-badge">{{ excursionOrders.length }} resultados</span>
    </div>

    @if (loading) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Searching orders...</p>
    </div>
    } @else {
    <app-generic-table
      [columns]="excursionColumns"
      [data]="excursionOrders"
      (edit)="handleEdit($event)"
      (delete)="handleDelete($event)">
    </app-generic-table>
    }
  </div>
</section>
