<section class="activity-section mt-5 flex flex-col gap-8">

  <!-- Header -->
  <div class="section-header flex justify-between items-start">
    <div>
      <h2
        class="section-title text-2xl font-extrabold text-foreground m-0">Activity
        Listing</h2>
      <p class="section-subtitle text-muted-foreground mt-1">Operational
        logistics and order control</p>
    </div>
    <button
      class="btn-refresh flex items-center gap-2 bg-primary text-primary-foreground border-none px-5 py-3 rounded-(--radius) font-semibold cursor-pointer transition-all duration-200 hover:opacity-90 hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed"
      (click)="loadExcursions()" [disabled]="loading">
      <lucide-icon name="refresh-cw" size="16"
        [class.spinning]="loading"></lucide-icon>
      Refresh
    </button>
  </div>

  <!-- Filters Bar -->
  <div
    class="filters-bar grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-card p-5 border border-border rounded-(--radius) items-end">
    <div class="filter-group flex flex-col gap-2">
      <label
        class="text-xs font-semibold text-muted-foreground uppercase">Search
        Customer</label>
      <div class="input-with-icon relative flex items-center">
        <lucide-icon name="search" size="16"
          class="absolute left-3 text-muted-foreground"></lucide-icon>
        <input type="text" [(ngModel)]="filters.customerName"
          (keyup.enter)="applyFilters()" placeholder="Nombre del cliente..."
          class="bg-background border border-border text-foreground pl-9 pr-3 py-2.5 rounded-md outline-none text-sm w-full focus:border-primary transition-colors">
      </div>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label
        class="text-xs font-semibold text-muted-foreground uppercase">Status</label>
      <select [(ngModel)]="filters.status" (change)="applyFilters()"
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm focus:border-primary transition-colors">
        <option value>All Orders</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="paid">Paid</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="deleted">Deleted</option>
      </select>
    </div>

    <div class="filter-group flex flex-col gap-2">
      <label class="text-xs font-semibold text-muted-foreground uppercase">Order
        #</label>
      <input type="text" [(ngModel)]="filters.orderNumber"
        (keyup.enter)="applyFilters()" placeholder="EX-000..."
        class="bg-background border border-border text-foreground px-3 py-2.5 rounded-md outline-none text-sm focus:border-primary transition-colors">
    </div>

    <div class="filter-actions flex gap-2">
      <button
        class="btn-primary bg-primary text-primary-foreground border-none px-6 py-2.5 rounded-md cursor-pointer font-semibold transition-colors"
        (click)="applyFilters()">Filter</button>
      <button
        class="btn-ghost bg-transparent border border-border text-muted-foreground px-3 py-2.5 rounded-md cursor-pointer flex items-center justify-center transition-all hover:bg-muted hover:text-foreground"
        (click)="resetFilters()" title="Limpiar">
        <lucide-icon name="rotate-ccw" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card bg-card border border-border rounded-(--radius) p-6">
    <div class="card-header flex justify-between items-center mb-6">
      <div class="header-left flex items-center gap-3 text-primary">
        <lucide-icon name="compass" size="20"></lucide-icon>
        <h3 class="text-foreground m-0 text-lg">Daily Excursions</h3>
      </div>
      <span
        class="count-badge bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold">{{
        excursionOrders.length }} resultados</span>
    </div>

    @if (loading) {
    <div
      class="loading-state py-16 flex flex-col items-center gap-4 text-muted-foreground">
      <div
        class="spinner w-10 h-10 border-3 border-muted border-t-primary rounded-full animate-spin"></div>
      <p>Searching orders...</p>
    </div>
    } @else {
    <app-generic-table
      [columns]="excursionColumns"
      [data]="excursionOrders"
      (edit)="handleEdit($event)"
      (delete)="handleDelete($event)">
    </app-generic-table>
    }
  </div>
</section>
