<div
  class="top-bar h-10 w-full bg-gradient-brand border-b border-black/5 flex items-center fixed top-0 left-0 z-1001 transition-transform duration-400 dark:border-border"
  [class.hide-topbar]="isScrollingDown"
  [class.-translate-y-full]="isScrollingDown">

  <div
    class="top-bar-container w-full max-w-350 mx-auto px-8 flex justify-between items-center text-sm font-medium text-foreground dark:text-background h-full max-md:px-4">

    <!-- Weather -->
    <div
      class="weather-info hide-mobile flex items-center gap-1.5 leading-none max-md:hidden">
      @if (weatherDetails; as weather) {
      @if (weather.icon) {
      <img
        [src]="'https://openweathermap.org/img/wn/' + weather.icon + '@2x.png'"
        [alt]="weather.description || 'Weather condition'"
        width="24"
        height="24"
        class="weather-dynamic-icon w-6 h-6 inline-flex align-middle -mr-0.5 drop-shadow-md" />
      }

      <span class="city">{{ weather.name }}</span>
      <span class="temp">Temp: {{ weather.temp }}°C</span>
      <lucide-icon name="droplets"
        class="icon-sm humidity-icon w-3.5 h-3.5 stroke-[2.5px] inline-flex items-center justify-center text-primary"
        aria-hidden="true"></lucide-icon>
      <span class="humidity text-sm opacity-90">Humidity: {{ weather.humidity
        }}%</span>
      }
    </div>

    <!-- Schedule -->
    <div class="schedule-info flex items-center gap-1.5 leading-none">
      <lucide-icon name="clock"
        class="icon-sm w-3.5 h-3.5 stroke-[2.5px] inline-flex items-center justify-center"
        aria-hidden="true"></lucide-icon>
      <time datetime="Mo-Sa 08:00-18:00">Mon - Sat: 8:00 AM - 6:00 PM</time>
    </div>

    <!-- WhatsApp Link Usando Componente app-button-link -->
    <div class="contact-action flex items-center">
      <a
        href="https://wa.me/18098369303?text=Hello%20ExpediNap!%20I'm%20visiting%20your%20website%20and%20I'd%20like%20to%20receive%20information."
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact ExpediNap on WhatsApp"
        class="inline-flex items-center justify-center gap-2 rounded-(--radius) font-medium transition-all duration-300 cursor-pointer border-none hover:brightness-110 hover:-translate-y-0.5 no-underline bg-[#25D366] text-white shadow-[0_4px_12px_rgba(37,211,102,0.3)] h-7 px-3 text-xs max-md:px-2">
        <i class="bi bi-whatsapp text-sm" aria-hidden="true"></i>
        <span class="btn-text max-md:hidden">WhatsApp</span>
      </a>
    </div>

  </div>
</div>
