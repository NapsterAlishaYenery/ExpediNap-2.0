<section class="yachts-section py-20 bg-background">
  <div class="container mx-auto px-4">

    <div class="section-header text-center mb-16">
      <span class="sub-title text-secondary uppercase tracking-[3px] font-bold text-sm">Premium Experience</span>
      <h2 class="main-title text-[clamp(2.5rem,5vw,3.5rem)] text-foreground my-2 mb-6">Luxury Yachts</h2>
      <p class="section-description text-muted-foreground max-w-175 mx-auto text-lg px-6 box-border">
        Sail through the crystal-clear waters of the Caribbean on our exclusive
        yachts.
        <br>
        Personalized service and unforgettable experiences.
      </p>
    </div>

    @if (isLoading) {
    <div class="loading-state flex flex-col items-center justify-center gap-6 py-20 text-muted-foreground text-center">
      <div class="spinner w-10 h-10 rounded-full border-3 border-border border-t-secondary animate-spin"></div>
      <p>Cargando flota exclusiva...</p>
    </div>
    } @else {
    <div class="yachts-grid grid gap-8 w-full max-w-350 mx-auto grid-cols-1 p-4 box-border xl:grid-cols-2">
      @for (item of yachtsList; track item._id) {
      <app-yacht-card [yacht]="item"></app-yacht-card>
      }
    </div>

    <div class="cta-wrapper flex justify-center mt-20 px-6">
      <a routerLink="/yachts" class="w-full md:w-auto">
        <app-button variant="secondary" size="xl" class="w-full md:w-auto md:px-14">
          EXPLORE THE ENTIRE FLEET
        </app-button>
      </a>
    </div>
    }

  </div>
</section>
