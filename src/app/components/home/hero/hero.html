<section
  class="relative h-screen min-h-150 w-full overflow-hidden bg-background"
  aria-label="Hero Carousel"
  role="region"
  aria-roledescription="carousel">

  @for (slide of slides; track slide.id) {
  <!-- Slide individual -->
  <div
    class="absolute inset-0 w-full h-full transition-all duration-1000 ease-out"
    [class.opacity-0]="$index !== currentSlide"
    [class.opacity-100]="$index === currentSlide"
    [class.scale-110]="$index !== currentSlide"
    [class.scale-100]="$index === currentSlide"
    [class.pointer-events-none]="$index !== currentSlide"
    [class.pointer-events-auto]="$index === currentSlide"
    role="group"
    aria-roledescription="slide"
    [attr.aria-label]="'Slide ' + ($index + 1) + ' of ' + slides.length"
    [attr.aria-hidden]="$index !== currentSlide">

    <!-- Imagen de fondo -->
    <img
      [src]="slide.image"
      [alt]="slide.title"
      class="absolute inset-0 w-full h-full object-cover"
      [attr.fetchpriority]="$index === 0 ? 'high' : 'low'" />

    <!-- Overlay dinámico -->
    <div
      class="absolute inset-0 bg-linear-to-r from-black/70 via-black/30 to-transparent dark:from-white/30 dark:via-white/10 dark:to-transparent transition-all duration-500 z-5">
    </div>

    <!-- Contenido centrado -->
    <div class="relative z-10 flex items-center h-full">
      <div class="container mx-auto px-4 md:px-8">
        <div class="max-w-3xl md:pl-[5%] text-center md:text-left">

          <!-- Título: Se renderiza como h1 único en la vista activa -->
          @if ($index === currentSlide) {
          <h1
            class="font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold leading-tight mb-4 text-white dark:text-black drop-shadow-lg transition-all duration-700 transform">
            {{ slide.title }}
          </h1>
          } @else {
          <p
            class="font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold leading-tight mb-4 text-white dark:text-black drop-shadow-lg transition-all duration-700 transform aria-hidden='true'">
            {{ slide.title }}
          </p>
          }

          <!-- Subtítulo -->
          <p
            class="text-base sm:text-lg md:text-xl max-w-xl mx-auto md:mx-0 mb-8 text-white/90 dark:text-black/80 transition-all duration-700 transform"
            [style.transition-delay]="$index === currentSlide ? '150ms' : '0ms'">
            {{ slide.subtitle }}
          </p>

          <!-- Botones de acción (Refactorizados con app-button-link) -->
          <div
            class="flex flex-wrap gap-4 justify-center md:justify-start transition-all duration-700 transform"
            [style.transition-delay]="$index === currentSlide ? '300ms' : '0ms'">
            <!-- CTA 1 (default / xl) -->
            <a
              [routerLink]="slide.cta1.href"
              [attr.tabindex]="$index === currentSlide ? 0 : -1"
              class="inline-flex items-center justify-center gap-2 rounded-(--radius) font-medium transition-all duration-300 cursor-pointer border-none hover:brightness-110 hover:-translate-y-0.5 no-underline bg-primary text-primary-foreground shadow-primary h-14 px-10 text-lg">
              <lucide-icon [name]="slide.cta1.icon" class="w-5 h-5"
                aria-hidden="true"></lucide-icon>
              <span>{{ slide.cta1.label }}</span>
            </a>

            <!-- CTA 2 (heroOutline / xl) -->
            <a
              [routerLink]="slide.cta2.href"
              [attr.tabindex]="$index === currentSlide ? 0 : -1"
              class="inline-flex items-center justify-center gap-2 rounded-(--radius) font-medium transition-all duration-300 cursor-pointer border-2 hover:brightness-110 hover:-translate-y-0.5 no-underline bg-transparent  h-14 px-10 text-lg backdrop-blur-sm border-white/50 text-white dark:text-black dark:border-black/50">
              <lucide-icon [name]="slide.cta2.icon" class="w-5 h-5"
                aria-hidden="true"></lucide-icon>
              <span>{{ slide.cta2.label }}</span>
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>
  }

  <!-- Controles de navegación (Permanece como button nativo) -->
  <div
    class="absolute bottom-5 left-0 right-0 z-30 flex justify-center items-center gap-6 px-4">
    <!-- Botón anterior -->
    <button
      (click)="prevSlide()"
      type="button"
      aria-label="Previous slide"
      class="w-10 h-10 rounded-full bg-black/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/40 transition-all duration-300 dark:bg-white/20 dark:text-black focus:outline-hidden focus:ring-2 focus:ring-primary">
      <lucide-icon name="chevron-left" aria-hidden="true"></lucide-icon>
    </button>

    <!-- Indicadores (Dots) -->
    <div class="flex gap-2" role="tablist" aria-label="Slides navigation">
      @for (dot of slides; track dot.id) {
      <button
        (click)="goToSlide($index)"
        type="button"
        role="tab"
        [attr.aria-selected]="$index === currentSlide"
        [attr.aria-label]="'Go to slide ' + ($index + 1)"
        class="h-1.5 rounded-full transition-all duration-300 bg-white/50 hover:bg-white dark:bg-black/50 dark:hover:bg-black focus:outline-hidden focus:ring-2 focus:ring-primary"
        [class.w-8]="$index === currentSlide"
        [class.w-1.5]="$index !== currentSlide"
        [class.bg-primary]="$index === currentSlide">
      </button>
      }
    </div>

    <!-- Botón siguiente -->
    <button
      (click)="nextSlide()"
      type="button"
      aria-label="Next slide"
      class="w-10 h-10 rounded-full bg-black/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/40 transition-all duration-300 dark:bg-white/20 dark:text-black focus:outline-hidden focus:ring-2 focus:ring-primary">
      <lucide-icon name="chevron-right" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  <!-- Indicador de scroll -->
  <div
    class="absolute bottom-8 right-8 z-30 hidden md:flex flex-col items-center gap-2 opacity-70 hover:opacity-100 transition-opacity"
    aria-hidden="true">
    <span
      class="text-[10px] tracking-[3px] writing-mode-vertical-rl text-white/60 dark:text-black/60">SCROLL</span>
    <div
      class="w-px h-12 bg-white/40 dark:bg-black/40 relative overflow-hidden">
      <div
        class="absolute top-0 left-0 w-full h-1/3 bg-white dark:bg-black animate-[scrollAnim_2s_infinite_ease-in-out]"></div>
    </div>
  </div>
</section>
