<section class="relative h-screen min-h-150 w-full overflow-hidden bg-background">
  @for (slide of slides; track $index) {
    <!-- Slide individual -->
    <div class="absolute inset-0 w-full h-full transition-all duration-1000 ease-out"
         [class.opacity-0]="$index !== currentSlide"
         [class.opacity-100]="$index === currentSlide"
         [class.scale-110]="$index !== currentSlide"
         [class.scale-100]="$index === currentSlide"
         [class.pointer-events-none]="$index !== currentSlide"
         [class.pointer-events-auto]="$index === currentSlide">
      
      <!-- Imagen de fondo -->
      <img [src]="slide.image" [alt]="slide.title" 
           class="absolute inset-0 w-full h-full object-cover">
      
      <!-- Overlay dinámico (Claro: oscuro / Oscuro: claro) -->
      <!-- En modo claro: bg-gradient-to-r from-black/70 via-black/30 to-transparent -->
      <!-- En modo oscuro: dark:from-white/30 dark:via-white/10 dark:to-transparent -->
      <div class="absolute inset-0 bg-linear-to-r from-black/70 via-black/30 to-transparent 
                  dark:from-white/30 dark:via-white/10 dark:to-transparent transition-all duration-500 z-5">
      </div>

      <!-- Contenido centrado -->
      <div class="relative z-10 flex items-center h-full">
        <div class="container mx-auto px-4 md:px-8">
          <div class="max-w-3xl md:pl-[5%] text-center md:text-left">
            
            <!-- Título -->
            <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold leading-tight mb-4 
                       text-white dark:text-black drop-shadow-lg
                       transition-all duration-700 transform"
                [class.opacity-0]="$index !== currentSlide"
                [class.opacity-100]="$index === currentSlide"
                [class.translate-y-10]="$index !== currentSlide"
                [class.translate-y-0]="$index === currentSlide">
              {{ slide.title }}
            </h1>

            <!-- Subtítulo -->
            <p class="text-base sm:text-lg md:text-xl max-w-xl mx-auto md:mx-0 mb-8 
                      text-white/90 dark:text-black/80"
                [class.opacity-0]="$index !== currentSlide"
                [class.opacity-100]="$index === currentSlide"
                [class.translate-y-10]="$index !== currentSlide"
                [class.translate-y-0]="$index === currentSlide"
                [style.transition-delay]="$index === currentSlide ? '150ms' : '0ms'">
              {{ slide.subtitle }}
            </p>

            <!-- Botones de acción -->
            <div class="flex flex-wrap gap-4 justify-center md:justify-start"
                [class.opacity-0]="$index !== currentSlide"
                [class.opacity-100]="$index === currentSlide"
                [class.translate-y-10]="$index !== currentSlide"
                [class.translate-y-0]="$index === currentSlide"
                [style.transition-delay]="$index === currentSlide ? '300ms' : '0ms'">
              
              <a [routerLink]="slide.cta1.href">
                <app-button variant="default" size="xl" className="gap-2 shadow-primary">
                  <lucide-icon [name]="slide.cta1.icon" class="w-5 h-5"></lucide-icon>
                  {{ slide.cta1.label }}
                </app-button>
              </a>

              <a [routerLink]="slide.cta2.href">
                <app-button variant="heroOutline" size="xl" className="gap-2 backdrop-blur-sm border-white/50 text-white dark:text-black dark:border-black/50">
                  <lucide-icon [name]="slide.cta2.icon" class="w-5 h-5"></lucide-icon>
                  {{ slide.cta2.label }}
                </app-button>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  }

  <!-- Controles de navegación (Flechas y Dots) -->
  <div class="absolute bottom-5 left-0 right-0 z-30 flex justify-center items-center gap-6 px-4">
    <!-- Botón anterior -->
    <button (click)="prevSlide()" 
            class="w-10 h-10 rounded-full bg-black/20 backdrop-blur-md text-white flex items-center justify-center 
                   hover:bg-white/40 transition-all duration-300 dark:bg-white/20 dark:text-black">
      <lucide-icon name="chevron-left"></lucide-icon>
    </button>

    <!-- Indicadores (Dots) -->
    <div class="flex gap-2">
      @for (dot of slides; track $index) {
        <button (click)="goToSlide($index)" 
                class="h-1.5 rounded-full transition-all duration-300 bg-white/50 hover:bg-white dark:bg-black/50 dark:hover:bg-black"
                [class.w-8]="$index === currentSlide"
                [class.w-1.5]="$index !== currentSlide"
                [class.bg-primary]="$index === currentSlide">
        </button>
      }
    </div>

    <!-- Botón siguiente -->
    <button (click)="nextSlide()" 
            class="w-10 h-10 rounded-full bg-black/20 backdrop-blur-md text-white flex items-center justify-center 
                   hover:bg-white/40 transition-all duration-300 dark:bg-white/20 dark:text-black">
      <lucide-icon name="chevron-right"></lucide-icon>
    </button>
  </div>

  <!-- Indicador de scroll (solo desktop) -->
  <div class="absolute bottom-8 right-8 z-30 hidden md:flex flex-col items-center gap-2 opacity-70 hover:opacity-100 transition-opacity">
    <span class="text-[10px] tracking-[3px] writing-mode-vertical-rl text-white/60 dark:text-black/60">SCROLL</span>
    <div class="w-px h-12 bg-white/40 dark:bg-black/40 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1/3 bg-white dark:bg-black animate-[scrollAnim_2s_infinite_ease-in-out]"></div>
    </div>
  </div>
</section>
