<section class="hero-container">
  @for (slide of slides; track $index) {
  <div class="hero-slide" [class.active]="$index === currentSlide">

    <img [src]="slide.image" [alt]="slide.title" class="hero-image">

    <div class="hero-overlay"></div>

    <div class="hero-content-wrapper">
      <div class="container mx-auto px-4">
        <div class="hero-text-box">
          <h1 class="hero-title" [class.animate]="$index === currentSlide">
            {{ slide.title }}
          </h1>
          <p class="hero-subtitle" [class.animate]="$index === currentSlide">
            {{ slide.subtitle }}
          </p>

          <div class="hero-actions" [class.animate]="$index === currentSlide">
            <a [routerLink]="slide.cta1.href">
              <app-button
                variant="default"
                size="xl"
                className="gap-2 shadow-primary">
                <lucide-icon [name]="slide.cta1.icon"
                  class="w-5 h-5"></lucide-icon>
                {{ slide.cta1.label }}
              </app-button>
            </a>

            <a [routerLink]="slide.cta2.href">
              <app-button
                variant="heroOutline"
                size="xl"
                [routerLink]="slide.cta2.href"
                className="gap-2">
                <lucide-icon [name]="slide.cta2.icon"
                  class="w-5 h-5"></lucide-icon>
                {{ slide.cta2.label }}
              </app-button>
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>
  }

  <div class="hero-controls">
    <button (click)="prevSlide()" class="control-btn">
      <lucide-icon name="chevron-left"></lucide-icon>
    </button>

    <div class="indicators">
      @for (dot of slides; track $index) {
      <button
        (click)="goToSlide($index)"
        class="dot"
        [class.active-dot]="$index === currentSlide">
      </button>
      }
    </div>

    <button (click)="nextSlide()" class="control-btn">
      <lucide-icon name="chevron-right"></lucide-icon>
    </button>
  </div>

  <div class="scroll-indicator">
    <span class="scroll-text">SCROLL</span>
    <div class="scroll-line">
      <div class="scroll-ball"></div>
    </div>
  </div>
</section>
