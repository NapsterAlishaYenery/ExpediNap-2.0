<div [class]="alertClasses" role="alert">
  <i [class]="iconClass" class="alert-icon-bi"></i>
  
  <div class="alert-content">
    @if (title) {
      <h5 class="alert-title">{{ title }}</h5>
    }
    @if (description) {
      <div class="alert-description">
        {{ description }}
      </div>
    }
    <ng-content></ng-content>
  </div>
</div>
