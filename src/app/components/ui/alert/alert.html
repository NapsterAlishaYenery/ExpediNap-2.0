<!-- Contenedor posicionado -->
<div 
  class="fixed bottom-6 right-6 z-9999 w-full max-w-95 overflow-hidden rounded-xl border backdrop-blur-xl shadow-2xl transition-all animate-toast-in sm:bottom-8 sm:right-8 sm:max-w-md max-sm:bottom-4 max-sm:right-4 max-sm:max-w-[calc(100%-2rem)] max-sm:rounded-lg"
  [ngClass]="variantClasses">
  
  <div class="flex gap-3 p-4 sm:gap-4 sm:p-5 max-sm:gap-2 max-sm:p-3">
    <!-- Icono -->
    <div class="shrink-0 text-lg sm:text-xl max-sm:text-base">
      <i [class]="iconClass"></i>
    </div>

    <!-- Texto -->
    <div class="flex flex-col gap-1">
      @if (title) {
        <h5 class="font-sans font-bold text-sm leading-none tracking-tight sm:text-[1rem] max-sm:text-xs">
          {{ title }}
        </h5>
      }
      @if (description) {
        <p class="font-sans text-xs opacity-80 leading-relaxed sm:text-sm max-sm:text-[0.7rem]">
          {{ description }}
        </p>
      }
      <ng-content></ng-content>
    </div>
  </div>

  <!-- BARRA DE PROGRESO INFERIOR -->
  <div 
    class="absolute bottom-0 left-0 h-1 w-full opacity-40 animate-progress"
    [ngClass]="progressBarClass"
    [style.animation-duration.ms]="duration">
  </div>
</div>
