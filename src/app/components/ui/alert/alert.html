<div 
  class="fixed bottom-4 right-4 z-9999 w-[calc(100%-2rem)] max-w-95 overflow-hidden rounded-lg border backdrop-blur-xl shadow-2xl transition-all animate-toast-in sm:bottom-8 sm:right-8 sm:max-w-md sm:rounded-xl"
  [ngClass]="variantClasses">
  
  <div class="flex gap-2 p-3 sm:gap-4 sm:p-5">
    <!-- Icono -->
    <div class="shrink-0 text-base sm:text-xl">
      <i [class]="iconClass" aria-hidden="true"></i>
    </div>

    <!-- Texto -->
    <div class="flex flex-col gap-1">
      @if (title) {
        <h5 class="font-sans font-bold text-xs leading-none tracking-tight sm:text-[1rem]">
          {{ title }}
        </h5>
      }
      @if (description) {
        <p class="font-sans text-[0.7rem] opacity-80 leading-relaxed sm:text-sm">
          {{ description }}
        </p>
      }
      <ng-content></ng-content>
    </div>
  </div>

  <!-- Barra de progreso inferior (Decorativa) -->
  <div 
    aria-hidden="true"
    class="absolute bottom-0 left-0 h-1 w-full opacity-40 animate-progress"
    [ngClass]="progressBarClass"
    [style.animation-duration.ms]="duration">
  </div>
</div>
