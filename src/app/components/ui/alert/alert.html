<!-- Contenedor posicionado -->
<div 
  class="fixed bottom-8 right-6 z-9999 w-full max-w-95 animate-toast-in overflow-hidden rounded-xl border backdrop-blur-xl shadow-2xl transition-all"
  [ngClass]="variantClasses">
  
  <div class="flex gap-4 p-5">
    <!-- Icono -->
    <div class="shrink-0 text-xl">
      <i [class]="iconClass"></i>
    </div>

    <!-- Texto -->
    <div class="flex flex-col gap-1">
      @if (title) {
        <h5 class="font-sans font-bold text-[1rem] leading-none tracking-tight">
          {{ title }}
        </h5>
      }
      @if (description) {
        <p class="font-sans text-sm opacity-80 leading-relaxed">
          {{ description }}
        </p>
      }
      <ng-content></ng-content>
    </div>
  </div>

  <!-- BARRA DE PROGRESO INFERIOR -->
  <div 
    class="absolute bottom-0 left-0 h-1 w-full opacity-40 animate-progress"
    [ngClass]="progressBarClass"
    [style.animation-duration.ms]="duration">
  </div>
</div>
