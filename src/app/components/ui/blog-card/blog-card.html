<article
  class="group flex flex-col h-full bg-card border border-border rounded-(--radius) overflow-hidden transition-all duration-300 ease-out hover:-translate-y-2 hover:shadow-xl hover:shadow-primary/5">

  <!-- IMAGEN CON ENLACE (Permanece como a nativo) -->
  <a [routerLink]="['/blogs', blog.slug]"
    class="relative w-full h-52 overflow-hidden block">
    <img
      [src]="blog.image.url"
      [alt]="blog.image.alt || blog.title"
      loading="lazy"
      class="w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-105">
  </a>

  <!-- CUERPO -->
  <div class="p-6 max-md:p-5 flex flex-col grow">

    <!-- CATEGORÍAS -->
    <div class="flex flex-wrap gap-1.5 mb-3">
      @for (cat of blog.category; track cat) {
      <app-badge variant="outline"
        class="text-[0.65rem] uppercase tracking-wider border-primary/40 text-primary">
        {{ cat }}
      </app-badge>
      }
    </div>

    <!-- TÍTULO (Permanece como a nativo) -->
    <h3
      class="font-serif text-xl font-bold leading-snug mb-2 text-foreground transition-colors duration-200 group-hover:text-primary">
      <a [routerLink]="['/blogs', blog.slug]"
        class="focus:outline-none focus:underline">
        {{ blog.title }}
      </a>
    </h3>

    <!-- EXCERPT -->
    <p class="text-sm text-muted-foreground line-clamp-3 leading-relaxed mb-6">
      {{ blog.excerpt }}
    </p>

    <!-- FOOTER -->
    <div
      class="flex items-center justify-between mt-auto pt-4 border-t border-border/50 gap-4 flex-wrap">

      <!-- METADATOS -->
      <div
        class="flex items-center gap-3 text-xs text-muted-foreground flex-wrap">
        <div class="flex items-center gap-1.5">
          <lucide-icon name="calendar"
            class="w-3.5 h-3.5 shrink-0"></lucide-icon>
          <time [attr.datetime]="blog.createdAt">{{ blog.createdAt | date:
            'mediumDate' }}</time>
        </div>

        <div class="flex items-center gap-1.5">
          <lucide-icon name="user" class="w-3.5 h-3.5 shrink-0"></lucide-icon>
          <span class="truncate max-w-30">{{ blog.author }}</span>
        </div>
      </div>

      <!-- BOTÓN LEER MÁS: Reemplazado a app-button-link limpio -->
      <a
        [routerLink]="['/blogs', blog.slug]"
        class="justify-center rounded-(--radius) transition-all duration-300 cursor-pointer border-none hover:brightness-110 hover:-translate-y-0.5 no-underline bg-transparent hover:bg-muted text-primary p-0 h-auto font-medium inline-flex items-center gap-1.5 group/btn shrink-0">
        <span>Read more</span>
        <lucide-icon name="arrow-right"
          class="w-4 h-4 transition-transform duration-300 group-hover/btn:translate-x-1"></lucide-icon>
      </a>

    </div>
  </div>
</article>
