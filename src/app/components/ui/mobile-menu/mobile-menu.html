<!-- OVERLAY / BACKDROP -->
<div
  class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 transition-opacity duration-300"
  [class.top-[120px]]="!isScrollingDown"
  [class.top-[70px]]="isScrollingDown"
  [class.opacity-100]="menuService.isOpen$ | async"
  [class.pointer-events-auto]="menuService.isOpen$ | async"
  [class.opacity-0]="!(menuService.isOpen$ | async)"
  [class.pointer-events-none]="!(menuService.isOpen$ | async)"
  (click)="menuService.close()"
  aria-hidden="true">
</div>

<!-- DRAWER PANEL -->
<aside
  role="dialog"
  aria-modal="true"
  aria-label="Menú de navegación móvil"
  class="fixed right-0 w-[85%] max-w-87.5 bg-card border-l border-b border-border z-50 shadow-2xl flex flex-col p-6 transition-all duration-300 ease-out"
  [class.top-[120px]]="!isScrollingDown"
  [class.h-[calc(100dvh-120px)]]="!isScrollingDown"
  [class.top-[70px]]="isScrollingDown"
  [class.h-[calc(100dvh-70px)]]="isScrollingDown"
  [class.translate-x-0]="menuService.isOpen$ | async"
  [class.translate-x-full]="!(menuService.isOpen$ | async)">

  <!-- NAV LINKS (CON SCROLL INTERNO) -->
  <nav class="flex-1 overflow-y-auto py-2">
    <ul class="flex flex-col gap-1.5 p-0 m-0 list-none">
      @for (item of menuItems; track item.name) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-accent/15 text-accent font-semibold"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          (click)="menuService.close()"
          class="flex items-center gap-3.5 px-4 py-3 rounded-xl text-foreground font-medium transition-colors hover:bg-accent/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent group">
          <lucide-icon
            [name]="item.icon"
            class="w-5 h-5 text-muted-foreground transition-colors group-hover:text-accent">
          </lucide-icon>
          <span>{{ item.name }}</span>
        </a>
      </li>
      }
    </ul>
  </nav>

  <!-- FOOTER CON BOTÓN DE ACCIÓN -->
  <div class="shrink-0 pt-4 border-t border-border">
    <a
      [routerLink]="['/excursions']"
      (click)="menuService.close()"
      class="inline-flex items-center gap-2 rounded-(--radius) font-medium transition-all duration-300 cursor-pointer border-none hover:brightness-110 hover:-translate-y-0.5 no-underline bg-accent text-accent-foreground shadow-glow h-12 px-8 text-base w-full justify-center">
      Book Now
    </a>
  </div>

</aside>
