<nav 
  aria-label="Breadcrumb" 
  class="mt-30 max-md:mt-26 py-3 max-md:py-2 bg-muted/60 border-b border-border/60 dark:bg-muted/20 dark:border-border/40">
  <div class="max-w-7xl mx-auto px-8 max-md:px-4">
    <ol class="flex items-center gap-2 flex-wrap list-none p-0 m-0">
      @for (crumb of (breadcrumbService.breadcrumbs$ | async); track crumb.url; let last = $last) {
        <li class="flex items-center text-xs sm:text-sm">
          @if (!last) {
            <a 
              [routerLink]="crumb.url" 
              class="font-medium text-muted-foreground dark:text-zinc-400 transition-colors duration-200 hover:text-accent dark:hover:text-accent focus-visible:outline-none focus-visible:underline">
              {{ crumb.label }}
            </a>
            <lucide-icon 
              name="chevron-right" 
              class="w-3.5 h-3.5 ml-2 text-muted-foreground/60 dark:text-zinc-500 shrink-0" 
              aria-hidden="true">
            </lucide-icon>
          } @else {
            <span 
              class="font-semibold text-foreground dark:text-zinc-100 truncate max-w-50 sm:max-w-none" 
              aria-current="page">
              {{ crumb.label }}
            </span>
          }
        </li>
      }
    </ol>
  </div>
</nav>
