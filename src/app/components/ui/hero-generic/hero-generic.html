<section class="relative min-h-95 md:min-h-115 flex items-center justify-center overflow-hidden bg-background">
  
  <!-- 1. Imagen de fondo con zoom sutil (Ken Burns effect) -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <img
      [src]="bgImageUrl"
      [alt]="title"
      class="w-full h-full object-cover object-center scale-105 animate-hero-zoom transition-transform duration-1000"
      loading="eager"
      fetchpriority="high"
      width="1920"
      height="600" />
    
    <!-- Multi-Overlay: Gradiente para contraste + Vignette sutil en bordes -->
    <div class="absolute inset-0 bg-linear-to-b from-background/40 via-background/70 to-background"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,var(--tw-gradient-stops))] from-transparent via-background/40 to-background/90"></div>
  </div>

  <!-- 2. Luces/Glow de fondo estilo Aura (Modern UI Glow) -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-75 sm:w-125 h-45 sm:h-62.5 bg-accent/20 rounded-full blur-[90px] pointer-events-none z-0"></div>

  <!-- 3. Contenido principal con animación fade-in-up y Glassmorphism -->
  <div class="relative z-10 container mx-auto px-4 sm:px-6 lg:px-8 text-center pt-12 pb-10 flex flex-col items-center">
    
    @if (badgeText) {
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-accent/10 text-accent border border-accent/20 backdrop-blur-md shadow-sm mb-6 animate-fade-in">
        <span class="w-2 h-2 rounded-full bg-accent animate-ping"></span>
        <span>{{ badgeText }}</span>
      </div>
    }
    
    <h1 class="text-3xl sm:text-5xl md:text-6xl font-black text-foreground tracking-tight max-w-4xl mx-auto leading-[1.15] drop-shadow-sm">
      {{ title }}
    </h1>

    <p class="mt-5 text-base sm:text-lg md:text-xl text-muted-foreground/90 max-w-2xl mx-auto font-medium leading-relaxed">
      {{ description }}
    </p>

    <!-- Adorno inferior sutil (Línea con resplandor) -->
    <div class="mt-8 w-24 h-1 rounded-full bg-linear-to-r from-transparent via-accent/60 to-transparent"></div>

  </div>
</section>
