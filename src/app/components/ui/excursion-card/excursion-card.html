<article
  class="group relative flex flex-col h-full bg-card border border-border rounded-2xl overflow-hidden transition-all duration-300 ease-out hover:-translate-y-1.5 hover:shadow-xl hover:shadow-primary/10">

  <!-- ============================================ -->
  <!-- IMAGEN CON BADGES -->
  <!-- ============================================ -->
  <div class="relative w-full aspect-16/10 overflow-hidden bg-muted/40">
    <img
      [src]="excursion.images.main.url"
      [alt]="excursion.images.main.alt || excursion.name"
      width="400"
      height="250"
      decoding="async"
      loading="lazy"
      class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105" />

    <!-- BADGE CATEGORÍA -->
    <div class="absolute top-3 left-3 z-10">
      <app-badge variant="accent"
        class="capitalize text-[0.65rem] font-semibold tracking-wider px-2.5 py-1 backdrop-blur-md">
        {{ mainCategory }}
      </app-badge>
    </div>

    <!-- DURACIÓN OVERLAY -->
    <div
      class="absolute bottom-3 right-3 z-10 bg-black/60 backdrop-blur-md text-white text-[0.7rem] font-medium px-3 py-1 rounded-full flex items-center gap-1.5 border border-white/10">
      <lucide-icon name="clock" class="w-3.5 h-3.5"
        aria-hidden="true"></lucide-icon>
      <span>{{ excursion.duration.value }} {{ excursion.duration.unit }}</span>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- CONTENIDO -->
  <!-- ============================================ -->
  <div class="flex-1 p-5 flex flex-col justify-between">
    <div>
      <!-- TÍTULO -->
      <h3
        class="font-serif text-lg font-bold leading-snug text-foreground transition-colors duration-300 group-hover:text-primary line-clamp-2 mb-2">
        <a [routerLink]="['/excursions', excursion.slug]"
          class="focus:outline-none focus:underline">
          {{ excursion.name }}
        </a>
      </h3>

      <!-- DESCRIPCIÓN CORTA -->
      <p
        class="text-xs text-muted-foreground line-clamp-2 mb-4 leading-relaxed">
        {{ excursion.shortDescription }}
      </p>

      <!-- INFO RÁPIDA (Ubicación + Edad) -->
      <div class="flex items-center gap-4 mb-4 text-xs text-muted-foreground">
        <div class="flex items-center gap-1.5 min-w-0">
          <lucide-icon name="map-pin" class="w-3.5 h-3.5 text-primary shrink-0"
            aria-hidden="true"></lucide-icon>
          <span class="truncate">{{ excursion.location.locationName }}</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <lucide-icon name="users" class="w-3.5 h-3.5 text-primary shrink-0"
            aria-hidden="true"></lucide-icon>
          <span>+{{ excursion.minimumAge }} años</span>
        </div>
      </div>
    </div>

    <!-- PRECIO + BOTÓN DE ENLACE -->
    <div
      class="flex items-center justify-between gap-2 pt-4 border-t border-border/60 mt-auto">
      <!-- PRECIO -->
      <div class="flex items-baseline gap-1 shrink-0">
        <span class="text-2xl font-black text-primary tracking-tight">
          ${{ excursion.pricing.adultPrice }}
        </span>
        <span class="text-[0.7rem] text-muted-foreground font-medium">/
          adulto</span>
      </div>

      <!-- BOTÓN REEMPLAZADO A APP-BUTTON-LINK -->
      <a
        [routerLink]="['/excursions', excursion.slug]"
        aria-label="Ver detalles de la excursión"
        class="inline-flex items-center gap-1.5 justify-center rounded-(--radius) transition-all duration-300 cursor-pointer border-none hover:brightness-110 hover:-translate-y-0.5 no-underline bg-accent text-accent-foreground shadow-glow font-semibold text-xs px-3.5 h-9 shrink-0">
        <span>Ver más</span>
        <lucide-icon name="arrow-right"
          class="w-3.5 h-3.5 transition-transform duration-300 group-hover:translate-x-1"
          aria-hidden="true"></lucide-icon>
      </a>
    </div>
  </div>
</article>
