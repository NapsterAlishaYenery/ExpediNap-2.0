<div class="w-full max-w-212.5 mx-auto flex flex-col gap-3 px-4 md:px-0">
  
  @for (item of items; track $index) {
    <div 
      class="group transition-all duration-500 rounded-xl border overflow-hidden backdrop-blur-md"
      [ngClass]="item.isOpen 
        ? 'bg-card/80 border-accent/50 shadow-[0_10px_25px_-5px_hsl(var(--accent)/0.1)] scale-[1.01]' 
        : 'bg-white/5 border-border/50 hover:bg-white/10'">
      
      <!-- Trigger (Botón) -->
      <button 
        type="button"
        class="w-full flex items-center justify-between p-5 text-left cursor-pointer transition-colors"
        [attr.aria-expanded]="item.isOpen"
        [attr.aria-controls]="'faq-panel-' + $index"
        [id]="'faq-button-' + $index"
        (click)="toggleItem($index)">
        
        <span class="font-sans font-semibold text-lg md:text-xl text-foreground pr-4">
          {{ item.question }}
        </span>

        <lucide-icon 
          name="chevron-down" 
          class="w-5 h-5 text-muted-foreground transition-all duration-500 shrink-0"
          [class.rotate-180]="item.isOpen"
          [class.text-accent]="item.isOpen"
          aria-hidden="true">
        </lucide-icon>
      </button>

      <!-- Contenido Animado con Grid -->
      <div 
        [id]="'faq-panel-' + $index"
        role="region"
        [attr.aria-labelledby]="'faq-button-' + $index"
        class="grid overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.3,0,0.2,1)]"
        [style.grid-template-rows]="item.isOpen ? '1fr' : '0fr'"
        [style.opacity]="item.isOpen ? '1' : '0'">
        
        <div 
          class="p-6 pt-0 font-sans text-base text-foreground/70 leading-relaxed transition-transform duration-500 overflow-hidden"
          [class.translate-y-0]="item.isOpen"
          [class.-translate-y-2]="!item.isOpen">
          {{ item.answer }}
          <ng-content></ng-content>
        </div>
      </div>

    </div>
  }

</div>
