<div class="flex flex-col gap-4 w-full">
  
  <!-- VISTA PRINCIPAL (MEDIOS SELECCIONADOS) -->
  <div class="relative w-full aspect-video bg-muted/40 rounded-3xl overflow-hidden shadow-lg border border-border/50">
    @if (selectedImage.mediaType === 'video') {
      <video
        [src]="selectedImage.url"
        [poster]="selectedImage.thumbnailUrl"
        controls
        muted
        playsinline
        preload="metadata"
        class="absolute inset-0 w-full h-full object-cover">
        Tu navegador no soporta reproducción de video.
      </video>
    } @else {
      <img
        [src]="selectedImage.url"
        [alt]="selectedImage.alt || 'Galería de imágenes'"
        class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 ease-in-out">
    }
  </div>

  <!-- CARRUSEL DE MINIATURAS -->
  <div class="relative flex items-center gap-2 px-1">
    
    <!-- BOTÓN ANTERIOR -->
    <button
      type="button"
      class="hidden sm:flex shrink-0 w-10 h-10 rounded-full border border-border bg-card text-foreground items-center justify-center transition-all duration-200 shadow-sm hover:bg-accent hover:text-accent-foreground hover:border-accent disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
      (click)="scrollGallery(-1)"
      aria-label="Ver imagen anterior">
      <lucide-icon name="chevron-left" class="w-5 h-5"></lucide-icon>
    </button>

    <!-- CONTENEDOR CON SCROLL HORIZONTAL -->
    <div
      #carousel
      class="flex gap-3 overflow-x-auto scroll-smooth py-2 no-scrollbar px-1">
      
      @for (item of allImages; track item.url) {
        <button
          type="button"
          (click)="selectImage(item)"
          [class.ring-2]="selectedImage.url === item.url"
          [class.ring-accent]="selectedImage.url === item.url"
          [class.-translate-y-1]="selectedImage.url === item.url"
          [class.shadow-md]="selectedImage.url === item.url"
          class="relative flex-none w-28 h-20 sm:w-32 sm:h-22 p-0 rounded-xl overflow-hidden border border-border bg-muted cursor-pointer transition-all duration-200 hover:opacity-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent">
          
          <!-- CONTENIDO DE LA MINIATURA -->
          @if (item.mediaType === 'video') {
            <video
              [src]="item.url"
              class="w-full h-full object-cover pointer-events-none"
              muted
              playsinline
              preload="metadata">
            </video>
            <!-- INDICADOR DE VIDEO PLAY -->
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
              <div class="w-7 h-7 rounded-full bg-background/80 backdrop-blur-xs flex items-center justify-center text-foreground">
                <lucide-icon name="play" class="w-3.5 h-3.5 fill-current ml-0.5"></lucide-icon>
              </div>
            </div>
          } @else {
            <img
              [src]="item.url"
              [alt]="item.alt || 'Miniatura'"
              class="w-full h-full object-cover">
          }
        </button>
      }
    </div>

    <!-- BOTÓN SIGUIENTE -->
    <button
      type="button"
      class="hidden sm:flex shrink-0 w-10 h-10 rounded-full border border-border bg-card text-foreground items-center justify-center transition-all duration-200 shadow-sm hover:bg-accent hover:text-accent-foreground hover:border-accent disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
      (click)="scrollGallery(1)"
      aria-label="Ver imagen siguiente">
      <lucide-icon name="chevron-right" class="w-5 h-5"></lucide-icon>
    </button>
  </div>

</div>
