<div class="flex flex-col gap-6 w-full">
  <!-- Imagen Principal -->
  <div class="main-view">
    <div class="relative w-full pt-[56.25%] bg-muted/50 rounded-3xl overflow-hidden shadow-lg">
      <img 
        [src]="selectedImage.url | imageUrl" 
        [alt]="selectedImage.alt"
        class="absolute top-0 left-0 w-full h-full object-cover transition-opacity duration-400 ease-in-out"
      >
    </div>
  </div>

  <!-- Carrusel de Miniaturas -->
  <div class="relative flex items-center gap-2 px-2.5">
    <button 
      class="nav-btn prev bg-background border border-border text-foreground w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-all duration-200 shadow-md z-2 hover:bg-accent hover:text-white hover:border-accent max-sm:hidden"
      (click)="scrollGallery(-1)" 
      aria-label="Previous">
      <i class="bi bi-chevron-left"></i>
    </button>

    <div 
      class="thumbnails-carousel flex gap-3 overflow-x-auto scroll-smooth py-2 no-scrollbar"
      #carousel>
      <button 
        class="thumb-btn flex-none w-30 h-21.25 p-0 border-3 border-transparent rounded-2xl overflow-hidden cursor-pointer bg-none transition-all duration-300 ease-in-out max-sm:w-25 max-sm:h-17.5"
        [class.is-active]="selectedImage.url === images.main.url"
        (click)="selectImage(images.main)">
        <img [src]="images.main.url | imageUrl" [alt]="images.main.alt" class="w-full h-full object-cover">
      </button>

      @for (img of images.gallery; track img.url) {
        <button 
          class="thumb-btn flex-none w-30 h-21.25 p-0 border-3 border-transparent rounded-2xl overflow-hidden cursor-pointer bg-none transition-all duration-300 ease-in-out max-sm:w-25 max-sm:h-17.5"
          [class.is-active]="selectedImage.url === img.url"
          (click)="selectImage(img)">
          <img [src]="img.url | imageUrl" [alt]="img.alt" class="w-full h-full object-cover">
        </button>
      }
    </div>

    <button 
      class="nav-btn next bg-background border border-border text-foreground w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-all duration-200 shadow-md z-2 hover:bg-accent hover:text-white hover:border-accent max-sm:hidden"
      (click)="scrollGallery(1)" 
      aria-label="Next">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
